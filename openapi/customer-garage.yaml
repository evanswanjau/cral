openapi: 3.0.3
info:
  title: Cruz Ride Auto - Customer Garage API
  version: "1.0.0"
  description: >
    "My cars" and garage quote requests for a signed-in customer (Phase 4
    PR GS2, docs/decisions/garage.md).

    A request names one of the customer's cars, a service type, what the
    car needs and a county. CRAL sends it to up to 5 approved garage
    outlets in that county that do that service, at most one per merchant,
    oldest approval first. With none, 422 `no_garages_in_county` and
    nothing is stored. Rate-limited to 5 an hour per customer.

    Each asked garage may send one itemised quote (lines: part, labour,
    delivery, other; integer cents), valid 48 h from when it was last sent,
    or decline.

    GS3 (orders): accepting a quote creates an order the customer pays CRAL
    for upfront by M-Pesa; CRAL holds it and pays the garage after the
    customer confirms (or 72 h after "ready" with no problem raised). Extra
    work is a second quote the customer accepts and pays before it is done.
    Every money POST requires an `Idempotency-Key`.

    PT1 (spare parts, docs/decisions/parts.md): `POST /me/parts-requests`
    asks up to 5 approved parts dealers in the county for one part against
    a car that has its chassis number, with a delivery address. Everything
    after that uses the routes below by id: the request (`kind: part`), its
    quotes (each naming `part_condition` and `fulfilment`, a delivered part
    carrying a priced `delivery` line), accept, pay, and the order (`kind:
    part`, ref `P-YYMMDD-NNN`). The dealer marks it delivered or fitted
    (`ready`); the customer confirms it is the right part (`confirm`) or
    reports a wrong part (`problem`), which goes to Ops. No extra-work
    quotes on a part. The lists take `kind` (default `service`).
  license:
    name: Proprietary - Cruz Ride Auto Limited
servers:
  - url: https://api.cral.co.ke/v1

paths:
  /me/cars:
    get:
      summary: My cars, newest first
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: A page of cars.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Car" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
    post:
      summary: Add a car
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarInput" }
      responses:
        "201":
          description: The car.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Car" }
        "409": { description: "`car_exists`: this plate is already on your account" }

  /me/cars/{carId}:
    parameters:
      - { name: carId, in: path, required: true, schema: { type: string } }
    patch:
      summary: Edit a car
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarInput" }
      responses:
        "200":
          description: The car.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Car" }
    delete:
      summary: Remove a car with no requests
      description: 409 `car_has_requests` once a request names it (its history stays).
      responses:
        "204": { description: Removed. }
        "409": { description: "`car_has_requests`" }

  /me/cars/{carId}/service-record:
    parameters:
      - { name: carId, in: path, required: true, schema: { type: string } }
    get:
      summary: The car's service record, latest job first
      description: >
        Every garage job on this car that was completed (confirmed by the
        customer, automatically 72 h after "ready", or released by Ops),
        with the work that was paid for, line by line (GS4). Cancelled and
        refunded jobs are not on the record. Another customer's car is 404.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: A page of service record entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  car: { $ref: "#/components/schemas/Car" }
                  data: { type: array, items: { $ref: "#/components/schemas/ServiceRecordEntry" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
        "404": { description: "`car_not_found`" }

  /me/parts-requests:
    post:
      summary: Ask parts dealers for a part (PT1)
      description: >
        Sent to up to 5 live parts outlets of approved merchants in the
        county, one per merchant, oldest approval first. The car must have
        its chassis number (422 `car_needs_chassis`). Shares the garage
        request rate limit (5 an hour). Read it back at
        `/me/garage-requests/{requestId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [car_id, part_name, description, county, delivery_address]
              properties:
                car_id: { type: string }
                part_name: { type: string, minLength: 3, maxLength: 120, example: Front brake pads }
                description: { type: string, minLength: 10, maxLength: 2000 }
                county: { type: string }
                delivery_address: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "201":
          description: The request (`kind` part), with how many dealers were asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageRequest" }
        "404": { description: "`car_not_found`" }
        "422": { description: "`car_needs_chassis`, `no_dealers_in_county`" }
        "429": { description: Rate limited. }

  /me/garage-requests:
    get:
      summary: My garage (or, with kind=part, parts) requests, newest first
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [service, part], default: service } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: A page of requests (each with `quote_count`, no lines).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/GarageRequest" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
    post:
      summary: Ask garages for a quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [car_id, service_type, description, county]
              properties:
                car_id: { type: string }
                service_type: { type: string, enum: [service, diagnostics, mechanical, bodywork, tyres, electrical, ac] }
                description: { type: string, minLength: 10, maxLength: 2000 }
                county: { type: string }
      responses:
        "201":
          description: The request, with how many garages were asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageRequest" }
        "404": { description: "`car_not_found`" }
        "422": { description: "`no_garages_in_county`" }
        "429": { description: Rate limited. }

  /me/garage-requests/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    get:
      summary: One request with its quotes
      responses:
        "200":
          description: The request. `quotes` lists sent quotes only, cheapest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageRequest" }

  /me/garage-requests/{requestId}/cancel:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      summary: Stop asking for quotes
      description: Only an `open` request (409 `request_not_open`). Garages can't quote it after this.
      responses:
        "200":
          description: The request, `cancelled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GarageRequest" }

  # ---- GS3: orders -----------------------------------------------------

  /me/garage-requests/{requestId}/quotes/{quoteId}/accept:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
      - { name: quoteId, in: path, required: true, schema: { type: string } }
    post:
      summary: Accept a garage's quote (creates an order)
      description: >
        The request must be `open` (409 `request_not_open`) and the quote
        `sent` (409 `quote_not_available`) and unexpired (409
        `quote_expired`). The request becomes `accepted`, every other
        garage's quote `superseded`, and an order is created
        `awaiting_payment` for the quote's total. The money (total, CRAL's
        commission, the garage's share) is snapshotted now and never
        recomputed.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "201":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { description: "`idempotency_key_required`" }
        "409": { description: "`request_not_open`, `quote_not_available`, `quote_expired`" }

  /me/garage-orders:
    get:
      summary: My garage jobs (or, with kind=part, part orders), newest first
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [service, part], default: service } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Order" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }

  /me/garage-orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    get:
      summary: One garage job
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: "`order_not_found`" }

  /me/garage-orders/{orderId}/pay:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      summary: Pay what is due by M-Pesa (STK push)
      description: >
        Pays `amount_due`: the accepted quote while the order is
        `awaiting_payment`, or an accepted extra-work quote while it is
        `in_progress`. Same payment rails and settle rules as a booking
        (`openapi/payments.yaml`): a success settles only for the exact
        amount. A prompt still open is returned rather than pushed twice; a
        quote already paid is 409 `already_paid`. A second success for the
        same quote, or money arriving for a cancelled order, is refunded
        automatically.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "0712345678" }
      responses:
        "202":
          description: The prompt is on its way. Poll the order's `payment`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_request_id: { type: string }
                  status: { type: string }
        "409": { description: "`already_paid`, `order_not_payable`" }
        "422": { description: "`invalid_phone`" }

  /me/garage-orders/{orderId}/cancel:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      summary: Cancel a job nobody has paid for
      description: Only `awaiting_payment` (409 `order_not_cancellable`), with no prompt open (409 `payment_in_flight`). The request becomes `cancelled`.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: The order, `cancelled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /me/garage-orders/{orderId}/extras/{quoteId}/accept:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
      - { name: quoteId, in: path, required: true, schema: { type: string } }
    post:
      summary: Say yes to an extra-work quote
      description: >
        Only while the order is `in_progress` and the extra quote `sent` and
        unexpired. Its money is snapshotted now; it becomes `amount_due`,
        paid with `/pay`. Nothing joins the bill until it is paid.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { description: "`order_state_changed`, `quote_not_available`, `quote_expired`" }

  /me/garage-orders/{orderId}/extras/{quoteId}/decline:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
      - { name: quoteId, in: path, required: true, schema: { type: string } }
    post:
      summary: Say no to an extra-work quote
      description: A `sent` extra, or an accepted one not yet paid (409 `payment_in_flight` while a prompt is open). The garage finishes the original scope.
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /me/garage-orders/{orderId}/confirm:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      summary: Confirm the job is done
      description: Only `ready` (409 `order_not_ready`). The garage's share becomes payable in its next payout run.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        "200":
          description: The order, `completed`, `confirmed_by` `customer`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

  /me/garage-orders/{orderId}/problem:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      summary: Raise a problem
      description: >
        While `in_progress` or `ready` (409 `order_not_disputable`). Stops
        the 72 h auto-confirm; the money stays with CRAL until Ops settles
        it (released to the garage, or refunded). On a part order this is
        the wrong-part dispute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        "200":
          description: The order, `problem`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }

components:
  schemas:
    Money:
      type: object
      properties:
        amount: { type: integer, description: cents }
        currency: { type: string, example: KES }

    CarInput:
      type: object
      required: [make, model, year, plate]
      properties:
        make: { type: string }
        model: { type: string }
        year: { type: integer, minimum: 1960 }
        plate: { type: string, example: KDA 123B }
        chassis_number: { type: string, nullable: true, description: The VIN. Shown only to garages asked to quote. }

    Car:
      allOf:
        - $ref: "#/components/schemas/CarInput"
        - type: object
          properties:
            id: { type: string, example: car_01JD0000000000000000000000 }
            created_at: { type: string, format: date-time }

    QuoteLine:
      type: object
      properties:
        kind: { type: string, enum: [part, labour, delivery, other] }
        description: { type: string }
        amount: { $ref: "#/components/schemas/Money" }

    Quote:
      type: object
      properties:
        id: { type: string, example: quo_01JD0000000000000000000000 }
        outlet:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            county: { type: string }
            address: { type: string }
            visited_on: { type: string, format: date, nullable: true, description: From CRAL's recorded visit only. }
        lines: { type: array, items: { $ref: "#/components/schemas/QuoteLine" } }
        total: { $ref: "#/components/schemas/Money" }
        days_needed: { type: integer }
        part_condition: { type: string, enum: [genuine, oem, used], nullable: true, description: Parts quotes only. }
        fulfilment: { type: string, enum: [fitted, delivered], nullable: true, description: "Parts quotes only: fitted at the dealer's premises, or delivered to the request's address." }
        note: { type: string, nullable: true }
        sent_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        expired: { type: boolean, description: Derived, valid_until has passed. }

    GarageRequest:
      type: object
      properties:
        id: { type: string, example: rfq_01JD0000000000000000000000 }
        kind: { type: string, enum: [service, part] }
        car: { $ref: "#/components/schemas/Car" }
        service_type: { type: string, nullable: true, description: Garage requests only. }
        part_name: { type: string, nullable: true, description: Parts requests only. }
        delivery_address: { type: string, nullable: true, description: Parts requests only. }
        description: { type: string }
        county: { type: string }
        status: { type: string, enum: [open, cancelled, accepted] }
        garages_asked: { type: integer }
        garages_declined: { type: integer }
        quote_count: { type: integer }
        order:
          type: object
          nullable: true
          description: The order, once a quote was accepted (GS3).
          properties: { id: { type: string }, ref: { type: string }, status: { type: string } }
        quotes: { type: array, items: { $ref: "#/components/schemas/Quote" }, description: Detail only. }
        created_at: { type: string, format: date-time }
    OrderQuote:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [original, extra] }
        status: { type: string, enum: [sent, withdrawn, accepted, superseded, declined] }
        lines: { type: array, items: { $ref: "#/components/schemas/QuoteLine" } }
        total: { $ref: "#/components/schemas/Money" }
        days_needed: { type: integer }
        part_condition: { type: string, enum: [genuine, oem, used], nullable: true }
        fulfilment: { type: string, enum: [fitted, delivered], nullable: true }
        note: { type: string, nullable: true }
        sent_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        expired: { type: boolean }
        accepted_at: { type: string, format: date-time, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
    Order:
      type: object
      description: >
        A garage job (`ord_`, ref `G-YYMMDD-NNN`). `awaiting_payment -> paid
        -> in_progress -> ready -> completed`, plus `cancelled` (unpaid
        only), `problem` and `refunded`. `total` is the work paid for so far
        (the sum of the paid quotes). A `ready` job confirms itself at
        `auto_confirm_at` (72 h) unless a problem is raised. A part order
        (`kind` part, ref `P-YYMMDD-NNN`) goes `paid -> ready` when the
        dealer marks it delivered or fitted; `confirm` is "right part",
        `problem` the wrong-part dispute.
      properties:
        id: { type: string, example: ord_01JD0000000000000000000000 }
        ref: { type: string, example: G-261119-001 }
        status: { type: string, enum: [awaiting_payment, paid, in_progress, ready, completed, problem, cancelled, refunded] }
        kind: { type: string, enum: [service, part] }
        request_id: { type: string }
        service_type: { type: string, nullable: true }
        part_name: { type: string, nullable: true }
        part_condition: { type: string, enum: [genuine, oem, used], nullable: true, description: From the accepted quote. }
        fulfilment: { type: string, enum: [fitted, delivered], nullable: true, description: From the accepted quote. }
        delivery_address: { type: string, nullable: true }
        description: { type: string, nullable: true }
        car: { type: object, nullable: true, properties: { make: { type: string }, model: { type: string }, year: { type: integer }, plate: { type: string } } }
        outlet: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, address: { type: string }, county: { type: string } } }
        quotes: { type: array, items: { $ref: "#/components/schemas/OrderQuote" } }
        total: { $ref: "#/components/schemas/Money" }
        amount_due: { allOf: [{ $ref: "#/components/schemas/Money" }], nullable: true }
        due_quote_id: { type: string, nullable: true }
        payment:
          type: object
          nullable: true
          description: The latest prompt on this order.
          properties:
            status: { type: string, enum: [pending, success, failed, cancelled, expired] }
            quote_id: { type: string, nullable: true }
            amount: { $ref: "#/components/schemas/Money" }
            receipt: { type: string, nullable: true }
            failure_reason: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ready_at: { type: string, format: date-time, nullable: true }
        auto_confirm_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        confirmed_by: { type: string, enum: [customer, auto, ops], nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        problem_raised_at: { type: string, format: date-time, nullable: true }
        problem_note: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolution_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    ServiceRecordEntry:
      type: object
      description: One completed garage job on a car (GS4).
      properties:
        order_id: { type: string, example: ord_01JD0000000000000000000000 }
        ref: { type: string, example: G-261119-001 }
        service_type: { type: string, nullable: true, enum: [service, diagnostics, mechanical, bodywork, tyres, electrical, ac] }
        part_name: { type: string, nullable: true, description: A confirmed part order (PT1). }
        description: { type: string, nullable: true, description: What the customer asked for. }
        outlet:
          type: object
          nullable: true
          properties:
            name: { type: string }
            address: { type: string }
            county: { type: string }
        work:
          type: array
          description: The paid quotes, the original first, then any extra work.
          items:
            type: object
            properties:
              kind: { type: string, enum: [original, extra] }
              lines: { type: array, items: { $ref: "#/components/schemas/QuoteLine" } }
              total: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        paid_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time }
        confirmed_by: { type: string, enum: [customer, auto, ops] }
