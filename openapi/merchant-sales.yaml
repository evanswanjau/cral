openapi: 3.0.3
info:
  title: Cruz Ride Auto - Merchant Sale Listings API
  version: "1.0.0"
  description: >
    Cars a merchant lists for sale ("Cars for sale" in the merchant portal;
    Phase 6 PR CS1, docs/decisions/car-sales.md). Classifieds: CRAL checks
    the listing and its logbook before it goes live, buyers enquire (CS3),
    and buyer and seller pay each other directly. CRAL holds no money and
    takes no commission on a sale. Listings are free at launch.

    Statuses: `draft / pending / review / action / rejected / live /
    paused / sold / withdrawn`. The merchant moves a listing
    `draft|action|rejected -> pending` (submit), `live <-> paused`,
    `live|paused -> sold`, and any open status `-> withdrawn`. Ops moves
    `pending -> review -> live|action|rejected` (CS2, `admin-sales.yaml`).
    `sold` and `withdrawn` are final.

    Submitting needs at least 4 photos (at most 12) and the logbook.

    Every field is editable on `draft`, `action` and `rejected`. On `live`
    and `paused` only `asking_price`, `negotiable`, `viewing_area` and
    `description` can change; the rest is what Ops checked. Nothing changes
    while Ops has it (`pending`, `review`) or once it is final: 409
    `sale_listing_locked`.

    One open listing per plate: a second open listing for the same
    normalised plate is 409 `registration_already_listed`.

    `ref` is the plated reference `S-YYMMDD-NNN`, given when the listing is
    created.
  license:
    name: Proprietary - Cruz Ride Auto Limited
servers:
  - url: https://api.cral.co.ke/v1
    description: Production

tags:
  - name: sale-listings

paths:
  /merchant/sale-listings:
    get:
      tags: [sale-listings]
      summary: List this merchant's sale listings, newest first
      operationId: listSaleListings
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of listings. `counts` is whole-set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SaleListing" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
                  counts:
                    type: object
                    properties:
                      all: { type: integer }
                      needs_action: { type: integer, description: "`action` + `rejected`" }
                      live: { type: integer }
    post:
      tags: [sale-listings]
      summary: Start a sale listing (as a draft)
      operationId: createSaleListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleListingInput" }
      responses:
        "201":
          description: The new draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListing" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /merchant/sale-listings/{listingId}:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string, example: sal_01JC0000000000000000000000 } }
    get:
      tags: [sale-listings]
      summary: One sale listing
      operationId: getSaleListing
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListing" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [sale-listings]
      summary: Edit a listing (see the description for what can change when)
      operationId: updateSaleListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleListingPatch" }
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sale-listings]
      summary: Delete a draft
      description: Only a `draft` can be deleted. Anything sent to CRAL is withdrawn instead (409 `sale_listing_not_draft`).
      operationId: deleteSaleListing
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /merchant/sale-listings/{listingId}/files:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sale-listings]
      summary: Add a photo or the logbook
      description: >
        Multipart. `kind=photo` adds one photo (JPEG, PNG or WebP; up to 12).
        `kind=logbook` replaces the logbook (image or PDF). Allowed while
        every field is editable (`draft`, `action`, `rejected`); otherwise
        409 `sale_listing_locked`. Type is checked on the bytes.
      operationId: uploadSaleListingFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [photo, logbook] }
                file: { type: string, format: binary }
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListing" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /merchant/sale-listings/{listingId}/files/{fileId}:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
      - { name: fileId, in: path, required: true, schema: { type: string } }
    get:
      tags: [sale-listings]
      summary: The file's bytes (own listings only)
      operationId: readSaleListingFile
      responses:
        "200": { description: The file. }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [sale-listings]
      summary: Remove a photo or the logbook
      description: Same statuses as upload.
      operationId: deleteSaleListingFile
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListing" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /merchant/sale-listings/{listingId}/submit:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sale-listings]
      summary: Send the listing to CRAL for review
      description: >
        From `draft`, `action` or `rejected`. Goes to `pending` (or straight
        back to `review` when a reviewer already has it). 409
        `sale_listing_not_submittable` otherwise; 422 `photos_required` or
        `logbook_required` when the files are missing.
      operationId: submitSaleListing
      responses:
        "200":
          description: The listing, now `pending` or `review`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListing" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /merchant/sale-listings/{listingId}/status:
    parameters:
      - { name: listingId, in: path, required: true, schema: { type: string } }
    post:
      tags: [sale-listings]
      summary: Pause, resume, mark sold or withdraw
      description: >
        `paused` from `live`; `live` from `paused`; `sold` from `live` or
        `paused`; `withdrawn` from any status but `draft`, `sold` and
        `withdrawn`. Anything else is 409 `invalid_transition`.
      operationId: setSaleListingStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [paused, live, sold, withdrawn] }
      responses:
        "200":
          description: The listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleListing" }
        "409": { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: The standard error envelope.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  type: { type: string }
                  code: { type: string }
                  message: { type: string }
                  field: { type: string }
                  request_id: { type: string }

  schemas:
    Money:
      type: object
      properties:
        amount: { type: integer, description: Integer cents. }
        currency: { type: string, enum: [KES] }

    SaleListingStatus:
      type: string
      enum: [draft, pending, review, action, rejected, live, paused, sold, withdrawn]

    SaleListingFields:
      type: object
      properties:
        body_type: { type: string, enum: [sedan, suv, van, pickup, hatchback, wagon, truck, other] }
        make: { type: string, maxLength: 60 }
        model: { type: string, maxLength: 60 }
        year: { type: integer, minimum: 1950 }
        registration: { type: string, maxLength: 20 }
        mileage_km: { type: integer, minimum: 0 }
        transmission: { type: string, enum: [automatic, manual] }
        fuel: { type: string, enum: [petrol, diesel, hybrid, electric] }
        engine_cc: { type: integer, nullable: true }
        colour: { type: string, nullable: true }
        import_status: { type: string, enum: [locally_used, foreign_used, new] }
        accident_history: { type: string, enum: [none, minor, major] }
        known_faults: { type: string, description: 'Free text. "None known" is a valid answer.' }
        encumbered: { type: boolean, description: The logbook carries a bank or lender as joint owner. }
        asking_price: { $ref: "#/components/schemas/Money" }
        negotiable: { type: boolean }
        county: { type: string }
        viewing_area: { type: string, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 4000 }

    SaleListingInput:
      allOf:
        - $ref: "#/components/schemas/SaleListingFields"
        - type: object
          required: [body_type, make, model, year, registration, mileage_km, transmission, fuel, import_status, accident_history, known_faults, encumbered, asking_price, county, viewing_area]

    SaleListingPatch:
      $ref: "#/components/schemas/SaleListingFields"

    SaleListingFile:
      type: object
      properties:
        id: { type: string, example: slf_01JC0000000000000000000000 }
        kind: { type: string, enum: [photo, logbook] }
        original_name: { type: string }
        created_at: { type: string, format: date-time }

    SaleListing:
      allOf:
        - $ref: "#/components/schemas/SaleListingFields"
        - type: object
          properties:
            id: { type: string, example: sal_01JC0000000000000000000000 }
            ref: { type: string, example: S-261119-001 }
            status: { $ref: "#/components/schemas/SaleListingStatus" }
            reviewer_note: { type: string, nullable: true, description: Why Ops sent it back or turned it down. }
            photos: { type: array, items: { $ref: "#/components/schemas/SaleListingFile" } }
            logbook: { allOf: [{ $ref: "#/components/schemas/SaleListingFile" }], nullable: true }
            submitted_at: { type: string, format: date-time, nullable: true }
            live_at: { type: string, format: date-time, nullable: true }
            sold_at: { type: string, format: date-time, nullable: true }
            created_at: { type: string, format: date-time }
