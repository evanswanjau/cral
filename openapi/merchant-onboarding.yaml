openapi: 3.0.3
info:
  title: Cruz Ride Auto — Merchant Onboarding API
  version: "1.0.0"
  description: >
    Server-side persistence for the merchant onboarding wizard: owner
    details, payout, vehicles, documents, and submission. Frozen from the
    platform API spec §9 for Phase 1 (delivery plan). Merchant-portal
    audience only.

    Every mutating call bumps the merchant's `last_activity_at`, which is
    the clock the stalled-onboarding reminder emails (spec §9, decided
    2026-08-25) key off. There is exactly one merchant draft per user —
    every path here acts on the authenticated caller's own draft, so none
    of them take a merchant id.


    **Assist sessions** (Phase 3, PR AG3; `admin-agents.yaml` starts one).
    A CRAL sales agent can fill in the draft for the owner with an assist
    token: a public-audience access token backed by a `sessions` row with
    `kind = "assist"` and `assisted_by` = the agent, live for 1 hour, with
    no refresh token. `authenticate()` refuses it with `403 assist_scope`
    on every route except this allowlist: `GET`/`PATCH /merchant/onboarding`,
    `POST /merchant/onboarding/vehicles`, `PATCH`/`DELETE
    /merchant/onboarding/vehicles/{id}`, `POST /merchant/onboarding/documents`,
    `GET`/`DELETE /merchant/onboarding/documents/{id}` (only documents that
    agent uploaded; any other is `404`) and `POST
    /merchant/onboarding/assist/end`. Submit is outside it. Inside it,
    `PATCH` refuses `phone`, every payout field and `terms_accepted`
    (`403 assist_scope`, naming the field), since the payout number, the
    terms and the submission are the owner's own acts. Once the draft is
    submitted the token gets `409 onboarding_submitted`. Every write made
    with it is audited (`actor_type: admin`, the agent's id,
    `after.assisted_for` = the owner's user id) in the same transaction,
    and documents record `uploaded_by_admin_id`.
  license:
    name: Proprietary — Cruz Ride Auto Limited
servers:
  - url: https://api.cral.co.ke/v1
    description: Production
  - url: https://api.staging.cral.co.ke/v1
    description: Staging
  - url: https://api.sandbox.cral.co.ke/v1
    description: Sandbox

tags:
  - name: onboarding
    description: The merchant draft — owner/company/payout fields, step, submission
  - name: vehicles
    description: Vehicles added to the draft before submission
  - name: documents
    description: Owner and vehicle document/photo uploads

paths:
  # ---------------------------------------------------------------------
  # §9 Merchant onboarding
  # ---------------------------------------------------------------------
  /merchant/onboarding:
    get:
      tags: [onboarding]
      summary: Current onboarding progress
      operationId: getOnboarding
      description: >
        Never 404s — a caller with no merchant row yet gets a freshly
        initialized empty draft, so the wizard always has something to
        render on first load.
      responses:
        "200":
          description: Current draft state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
    patch:
      tags: [onboarding]
      summary: Update owner/company/payout/terms fields
      operationId: patchOnboarding
      description: >
        Partial update of every top-level draft field. Creation is implicit
        — the first PATCH from a new merchant creates their row. Every
        successful call bumps `last_activity_at`, not just ones that change
        `step` — that field is what the reminder-email system hangs off, so
        any real progress (even re-typing a field) resets the clock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchOnboardingRequest" }
      responses:
        "200":
          description: Updated draft state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /merchant/onboarding/vehicles:
    post:
      tags: [vehicles]
      summary: Add a vehicle to the draft
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201":
          description: Vehicle added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /merchant/onboarding/vehicles/{vehicleId}:
    parameters:
      - name: vehicleId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [vehicles]
      summary: Edit a vehicle
      operationId: patchVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [vehicles]
      summary: Remove a vehicle from the draft
      operationId: deleteVehicle
      description: Cascades its documents and photos.
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /merchant/onboarding/documents:
    post:
      tags: [documents]
      summary: Upload an owner or vehicle document/photo
      operationId: uploadDocument
      description: >
        Multipart upload. `kind` selects the slot; `vehicle_id` is required
        for vehicle-scoped kinds (`logbook`, `comprehensive_insurance`,
        `tracker_certificate`, `vehicle_photo`) and forbidden for owner
        kinds (`national_id`, `kra_pin`). Every kind except `vehicle_photo`
        is single-slot — a second upload replaces the first. `vehicle_photo`
        allows up to 8 per vehicle (at least 3 are needed to submit); a 9th
        is rejected with 422 `too_many_photos`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { $ref: "#/components/schemas/DocumentKind" }
                vehicle_id: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentUploadResponse" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /merchant/onboarding/documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [documents]
      summary: Download one document or photo
      operationId: getDocument
      description: >
        Streams the stored bytes back to the owning merchant. Authenticated
        like every other route — the storage bucket is never public and no
        token is ever placed in the URL, so the client fetches this with its
        bearer token and turns the response into an object URL for display.
        This is what lets an uploaded photo still render after a page reload,
        since object URLs do not survive one.

        A document belonging to another merchant is a 404, not a 403.
      responses:
        "200":
          description: The file's bytes
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `private` — per-user content behind a bearer token
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [documents]
      summary: Remove one document or photo
      operationId: deleteDocument
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /merchant/onboarding/assist/end:
    post:
      tags: [onboarding]
      summary: End assist sessions
      operationId: endAssist
      description: >
        With an assist token (the banner's "Exit"), ends that assist
        session. With the owner's own token, ends every live assist session
        on their account: the owner can always stop an agent. Each ended
        session writes `merchant.assist_ended` in the same transaction as
        the revocation. Idempotent: nothing live is `200` with `ended: 0`.
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: { type: integer, description: How many live assist sessions this closed }

  /merchant/onboarding/submit:
    post:
      tags: [onboarding]
      summary: Submit the draft for review
      operationId: submitOnboarding
      description: >
        Validates completeness server-side (a verified sign-in email first,
        then owner details, payout, at least
        one vehicle with at least 3 photos, all three vehicle documents and a non-expired
        insurance-expiry date if comprehensive insurance is attached, a
        truck type and capacity for every truck, a machine type for every
        machine, both owner documents, and merchant terms accepted) — the same rules the
        wizard already enforces client-side, re-checked here as the honest
        backstop. On success, flips `onboarding_submitted` and writes an
        audit row in the same transaction.
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "422":
          description: >
            Incomplete — `message` names the first missing thing. Code
            `email_not_verified` (field `email`) when the sign-in email has
            not been confirmed: the client shows its "Verify your email"
            step. Otherwise code `incomplete_onboarding`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            field: { type: string }
            doc_url: { type: string }
            request_id: { type: string }

    DocumentKind:
      type: string
      enum:
        [
          national_id,
          kra_pin,
          certificate_of_incorporation,
          company_kra_pin,
          cr12,
          logbook,
          comprehensive_insurance,
          tracker_certificate,
          vehicle_photo,
        ]

    DocumentSlot:
      type: object
      nullable: true
      properties:
        status: { type: string, enum: [attached] }
        document_id: { type: string }
        original_name: { type: string }
        size_bytes: { type: integer }
        content_type: { type: string }
        uploaded_at: { type: string, format: date-time }

    DocumentUploadResponse:
      type: object
      properties:
        document_id: { type: string }
        original_name: { type: string }
        size_bytes: { type: integer }
        content_type: { type: string }

    VehicleInput:
      type: object
      properties:
        type: { type: string, enum: [sedan, suv, van, truck, machinery] }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        registration:
          type: string
          description: >
            The number plate, or for a machine with `registration_kind:
            serial`, its serial number. Unique across CRAL either way.
        registration_kind:
          type: string
          enum: [plate, serial]
          default: plate
          description: >
            `serial` is allowed only for machinery that carries no plate
            (owner's call, 2026-11-26); any other category stores `plate`.
        seats:
          type: integer
          minimum: 1
          maximum: 70
          description: >
            Seats, asked for a sedan, SUV or van. Defaults to 5 when never
            sent. Renters filter cars on it.
        transmission: { type: string, enum: [Automatic, Manual] }
        fuel: { type: string, enum: [Petrol, Diesel, Hybrid, Electric] }
        colour: { type: string }
        truck_type:
          type: string
          nullable: true
          enum: [pickup, canter, box_body, flatbed, tipper, refrigerated, water_bowser, prime_mover, low_loader, crane_truck]
          description: >
            Only kept when `type` is `truck`; any other category stores
            null (sending one is ignored). Required at submission for a truck.
        payload_kg:
          type: integer
          nullable: true
          minimum: 1
          maximum: 100000
          description: How much the truck carries, in kilograms. Same rules as `truck_type`.
        machine_type:
          type: string
          nullable: true
          enum: [excavator, backhoe_loader, wheel_loader, skid_steer, bulldozer, grader, roller, forklift, telehandler, mobile_crane, concrete_mixer, other]
          description: >
            Only kept when `type` is `machinery`; any other category stores
            null. Required at submission for a machine (PR H1 of
            `docs/plans/hire-that-works.md`).
        county: { type: string, description: "Kenyan county the vehicle is based in — required at submission" }
        pickup_address: { type: string }
        daily_rate: { type: string, description: "KES, whole shillings, as a numeric string. Always the gross/list price the hirer pays, even when rate_mode is 'net'." }
        rate_mode:
          type: string
          enum: [list, net]
          default: list
          description: >
            Which price view the merchant used. "list" = they typed
            `daily_rate` directly; "net" = they typed a take-home amount and
            the form grossed it up. Display-only - `daily_rate` is the gross
            price either way.
        chauffeured: { type: boolean, description: "true = hire comes with the owner's driver; false = self-drive" }
        insurance_expiry: { type: string, format: date, nullable: true }

    Vehicle:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
        - type: object
          properties:
            id: { type: string }
            docs:
              type: object
              properties:
                logbook: { $ref: "#/components/schemas/DocumentSlot" }
                comprehensive_insurance: { $ref: "#/components/schemas/DocumentSlot" }
                tracker_certificate: { $ref: "#/components/schemas/DocumentSlot" }
            photos:
              type: array
              items: { $ref: "#/components/schemas/DocumentSlot" }

    PatchOnboardingRequest:
      type: object
      properties:
        step: { type: integer }
        max_step:
          type: integer
          description: >
            Furthest step ever reached; drives which stepper tabs stay
            clickable. Applied monotonically — the server keeps the larger of
            the stored and submitted values, so navigating back to an earlier
            step never makes a later one unreachable.
        screen: { type: string, enum: [fleet, vehicle-form] }
        owner_type: { type: string, enum: [individual, company] }
        company_name: { type: string }
        company_cert_no: { type: string }
        company_kra: { type: string }
        company_email: { type: string, format: email }
        company_address: { type: string }
        first_name: { type: string }
        middle_name: { type: string }
        surname: { type: string }
        national_id: { type: string }
        kra_pin: { type: string }
        phone: { type: string }
        payout_same: { type: boolean }
        payout_method: { type: string, enum: [mpesa, bank] }
        payout_detail: { type: string }
        bank_name: { type: string }
        bank_branch: { type: string }
        bank_account_name: { type: string }
        bank_account_number: { type: string }
        terms_accepted: { type: boolean }
        drivers_only:
          type: boolean
          description: No car - this merchant only lists drivers, so submission needs no vehicle (docs/plans/drivers.md).
        garage_only:
          type: boolean
          description: No vehicle - this merchant signed up for garage services only, so submission needs no vehicle; premises are added in the portal (docs/decisions/garage.md).
        sells_only:
          type: boolean
          description: No vehicle - this merchant signed up to sell cars only, so submission needs no vehicle; sale listings are added in the portal (docs/decisions/car-sales.md).

    OnboardingState:
      type: object
      properties:
        step: { type: integer }
        max_step: { type: integer, description: Furthest step ever reached }
        screen:
          type: string
          enum: [fleet, vehicle-form]
          description: >
            Retained for history; clients should resume on the fleet list
            rather than mid-vehicle-form, since the in-progress form's
            identity is client-only state that no round-trip can restore.
        owner_type: { type: string, enum: [individual, company] }
        company_name: { type: string, nullable: true }
        company_cert_no: { type: string, nullable: true }
        company_kra: { type: string, nullable: true }
        company_email: { type: string, format: email, nullable: true }
        company_address: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        middle_name: { type: string, nullable: true }
        surname: { type: string, nullable: true }
        national_id: { type: string, nullable: true }
        kra_pin: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        phone_verified: { type: boolean, description: "Payout phone has passed SMS verification — required before submit" }
        payout_same: { type: boolean }
        payout_method: { type: string, enum: [mpesa, bank] }
        payout_detail: { type: string, nullable: true }
        bank_name: { type: string, nullable: true }
        bank_branch: { type: string, nullable: true }
        bank_account_name: { type: string, nullable: true }
        bank_account_number: { type: string, nullable: true }
        terms_accepted: { type: boolean }
        drivers_only:
          type: boolean
          description: No car - this merchant only lists drivers, so submission needs no vehicle (docs/plans/drivers.md).
        garage_only:
          type: boolean
          description: No vehicle - this merchant signed up for garage services only, so submission needs no vehicle; premises are added in the portal (docs/decisions/garage.md).
        sells_only:
          type: boolean
          description: No vehicle - this merchant signed up to sell cars only, so submission needs no vehicle; sale listings are added in the portal (docs/decisions/car-sales.md).
        owner_docs:
          # "Your documents" = national_id + kra_pin (individual and the
          # contact person of a company). certificate_of_incorporation +
          # company_kra_pin + cr12 are the "Company documents" set, present
          # and required only when owner_type is "company".
          type: object
          properties:
            national_id: { $ref: "#/components/schemas/DocumentSlot" }
            kra_pin: { $ref: "#/components/schemas/DocumentSlot" }
            certificate_of_incorporation: { $ref: "#/components/schemas/DocumentSlot" }
            company_kra_pin: { $ref: "#/components/schemas/DocumentSlot" }
            cr12: { $ref: "#/components/schemas/DocumentSlot" }
        vehicles:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }
        submitted: { type: boolean }
        last_activity_at: { type: string, format: date-time }
        account_email:
          type: string
          description: The account's sign-in email, for the wizard's read-only email field (an assist token can't call `/me`).
        email_verified:
          type: boolean
          description: >
            Whether the sign-in email has passed its code check (PR H6).
            Required before submit; while false the review step shows a
            "Verify your email" card that sends a code with
            `POST /auth/otp/request` (`purpose: signup`) and checks it with
            `POST /auth/otp/verify` (identity.yaml).
        assist:
          type: object
          nullable: true
          description: Set only when the caller is an assist token - who is filling this in, and until when. Drives the portal's banner.
          required: [agent_name, expires_at]
          properties:
            agent_name: { type: string }
            expires_at: { type: string, format: date-time }
        assists:
          type: array
          description: >
            Every assist session on this account, newest first (at most
            10), so the owner can see who helped and when. `active` is
            true while the session is still live; the owner can end it with
            `POST /merchant/onboarding/assist/end`.
          items:
            type: object
            required: [agent_name, started_at, ended_at, active]
            properties:
              agent_name: { type: string }
              started_at: { type: string, format: date-time }
              ended_at: { type: string, format: date-time, nullable: true, description: When it was ended, or when it expired }
              active: { type: boolean }

  responses:
    ValidationError:
      description: The request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such resource for this merchant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
