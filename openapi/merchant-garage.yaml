openapi: 3.0.3
info:
  title: Cruz Ride Auto - Merchant Garage Requests API
  version: "1.0.0"
  description: >
    Quote requests sent to a merchant's approved garage outlets, and the
    itemised quotes they send back (Phase 4 PR GS2,
    docs/decisions/garage.md).

    A merchant sees only requests one of its outlets was asked about. The
    car's chassis number is shown here, to the garage asked, and nowhere
    public. The customer's contact details are not shared at this stage.

    One quote per request: lines of `part`, `labour`, `delivery` or `other`,
    each a positive amount in integer cents, plus the days needed. Sending
    again revises it (the lines are replaced, the 48 h validity restarts).
    Quoting needs the request `open` and the outlet `live` (409
    `request_not_open`, 422 `outlet_not_live`).

    Take-home is returned in shillings after CRAL's service fee. The fee
    rate itself is never returned.
  license:
    name: Proprietary - Cruz Ride Auto Limited
servers:
  - url: https://api.cral.co.ke/v1

paths:
  /merchant/garage-requests:
    get:
      summary: Requests my garages were asked about, newest first
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [to_quote, quoted, closed, all], default: to_quote }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: A page of requests. `counts` is whole-set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MerchantRequest" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
                  counts:
                    type: object
                    properties:
                      to_quote: { type: integer }

  /merchant/garage-requests/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    get:
      summary: One request, with my quote if I sent one
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantRequest" }
        "404": { description: "`request_not_found` (not sent to this merchant)" }

  /merchant/garage-requests/{requestId}/quote:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      summary: Send or revise my quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "200":
          description: The request with my quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantRequest" }
        "409": { description: "`request_not_open`, `request_declined`" }
        "422": { description: "`outlet_not_live`, validation" }

  /merchant/garage-requests/{requestId}/quote/withdraw:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      summary: Withdraw my quote
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantRequest" }
        "409": { description: "`no_quote`" }

  /merchant/garage-requests/{requestId}/decline:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      summary: Say this garage can't do the job
      description: Withdraws any quote sent. 409 `request_not_open` once closed.
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantRequest" }

  /merchant/garage-requests/quote-preview:
    post:
      summary: What I keep for a set of lines
      description: Nothing is stored. Shilling amounts only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines: { type: array, items: { $ref: "#/components/schemas/QuoteLineInput" } }
      responses:
        "200":
          description: The totals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { $ref: "#/components/schemas/Money" }
                  take_home: { $ref: "#/components/schemas/Money" }

  # ---- GS3: orders -----------------------------------------------------

  /merchant/garage-orders:
    get:
      summary: Garage jobs for my premises
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [active, done, all], default: active } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: A page of jobs, newest first, with the count paid and waiting to start.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MerchantOrder" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
                  counts: { type: object, properties: { to_start: { type: integer } } }

  /merchant/garage-orders/{orderId}:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    get:
      summary: One job
      responses:
        "200":
          description: The job. Another merchant's is 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOrder" }

  /merchant/garage-orders/{orderId}/service-record:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    get:
      summary: Your own completed jobs on this job's car, latest first
      description: >
        The car's service record as this merchant may see it (GS4): only
        jobs one of its own outlets completed on the same customer car.
        Other garages' jobs are never included. Amounts are what the
        customer paid and what the merchant kept, in shillings; never CRAL's
        fee or its rate. Another merchant's order is 404.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25 } }
      responses:
        "200":
          description: A page of this merchant's completed jobs on the car.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MerchantServiceRecordEntry" } }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
        "404": { description: "`order_not_found`" }

  /merchant/garage-orders/{orderId}/start:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      summary: Start the work
      description: Only once the customer's payment has reached CRAL (`paid`; otherwise 409 `order_not_paid`).
      responses:
        "200":
          description: The job, `in_progress`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOrder" }

  /merchant/garage-orders/{orderId}/ready:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      summary: Mark the car ready
      description: >
        Only `in_progress` (409 `order_not_in_progress`) with no extra-work
        quote still waiting on the customer (409 `extra_pending`). Starts the
        72 h window after which the job confirms itself.
      responses:
        "200":
          description: The job, `ready`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOrder" }

  /merchant/garage-orders/{orderId}/extras:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
    post:
      summary: Quote extra work found mid-job
      description: >
        A second itemised quote on the same job, only while `in_progress`
        and one open at a time (409 `extra_pending`). The customer accepts
        and pays it before the work is done, or the garage finishes the
        original scope. Valid 48 h.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "201":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOrder" }

  /merchant/garage-orders/{orderId}/extras/{quoteId}/withdraw:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string } }
      - { name: quoteId, in: path, required: true, schema: { type: string } }
    post:
      summary: Withdraw an extra-work quote not yet paid
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantOrder" }
        "409": { description: "`quote_not_available`, `payment_in_flight`" }

components:
  schemas:
    Money:
      type: object
      properties:
        amount: { type: integer, description: cents }
        currency: { type: string, example: KES }

    QuoteLineInput:
      type: object
      required: [kind, description, amount]
      properties:
        kind: { type: string, enum: [part, labour, delivery, other] }
        description: { type: string, minLength: 2, maxLength: 200 }
        amount: { type: integer, minimum: 1, description: cents }

    QuoteInput:
      type: object
      required: [lines, days_needed]
      properties:
        lines: { type: array, minItems: 1, maxItems: 30, items: { $ref: "#/components/schemas/QuoteLineInput" } }
        days_needed: { type: integer, minimum: 1, maximum: 60 }
        note: { type: string, nullable: true, maxLength: 1000 }

    MerchantRequest:
      type: object
      properties:
        id: { type: string }
        outlet: { type: object, properties: { id: { type: string }, name: { type: string } } }
        car:
          type: object
          properties:
            make: { type: string }
            model: { type: string }
            year: { type: integer }
            plate: { type: string }
            chassis_number: { type: string, nullable: true }
        service_type: { type: string }
        description: { type: string }
        county: { type: string }
        customer_first_name: { type: string, nullable: true }
        status: { type: string, enum: [open, cancelled, accepted] }
        declined: { type: boolean }
        my_quote:
          type: object
          nullable: true
          properties:
            id: { type: string }
            status: { type: string, enum: [sent, withdrawn, accepted, superseded] }
            order_id: { type: string, nullable: true, description: "Set once the customer accepted this quote (GS3)." }
            lines: { type: array, items: { type: object } }
            total: { $ref: "#/components/schemas/Money" }
            take_home: { $ref: "#/components/schemas/Money" }
            days_needed: { type: integer }
            note: { type: string, nullable: true }
            sent_at: { type: string, format: date-time }
            valid_until: { type: string, format: date-time }
            expired: { type: boolean }
        created_at: { type: string, format: date-time }
    MerchantOrder:
      type: object
      description: >
        A garage job as the garage sees it. Shilling amounts only: `total`
        is what the customer paid CRAL for the work so far and `take_home`
        what the garage keeps. Never CRAL's commission or its rate, and
        never the customer's phone.
      properties:
        id: { type: string, example: ord_01JD0000000000000000000000 }
        ref: { type: string, example: G-261119-001 }
        status: { type: string, enum: [awaiting_payment, paid, in_progress, ready, completed, problem, cancelled, refunded] }
        request_id: { type: string }
        service_type: { type: string, nullable: true }
        description: { type: string, nullable: true }
        car: { type: object, nullable: true, properties: { make: { type: string }, model: { type: string }, year: { type: integer }, plate: { type: string } } }
        outlet: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, address: { type: string }, county: { type: string } } }
        customer_first_name: { type: string, nullable: true }
        quotes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              kind: { type: string, enum: [original, extra] }
              status: { type: string, enum: [sent, withdrawn, accepted, superseded, declined] }
              lines: { type: array, items: { type: object } }
              total: { $ref: "#/components/schemas/Money" }
              take_home: { $ref: "#/components/schemas/Money" }
              days_needed: { type: integer }
              note: { type: string, nullable: true }
              sent_at: { type: string, format: date-time }
              valid_until: { type: string, format: date-time }
              expired: { type: boolean }
              accepted_at: { type: string, format: date-time, nullable: true }
              paid_at: { type: string, format: date-time, nullable: true }
        total: { $ref: "#/components/schemas/Money" }
        take_home: { $ref: "#/components/schemas/Money" }
        amount_due: { allOf: [{ $ref: "#/components/schemas/Money" }], nullable: true }
        due_quote_id: { type: string, nullable: true }
        paid_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        ready_at: { type: string, format: date-time, nullable: true }
        auto_confirm_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        confirmed_by: { type: string, enum: [customer, auto, ops], nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }
        problem_raised_at: { type: string, format: date-time, nullable: true }
        problem_note: { type: string, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true }
        resolution_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    MerchantServiceRecordEntry:
      type: object
      properties:
        order_id: { type: string }
        ref: { type: string, example: G-261119-001 }
        service_type: { type: string, nullable: true }
        description: { type: string, nullable: true }
        outlet_name: { type: string, nullable: true }
        lines:
          type: array
          description: Every paid line, the original quote first, then extra work.
          items:
            type: object
            properties:
              kind: { type: string, enum: [part, labour, delivery, other] }
              description: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        take_home: { $ref: "#/components/schemas/Money" }
        completed_at: { type: string, format: date-time }
