openapi: 3.0.3
info:
  title: Cruz Ride Auto - Customer Bookings API
  version: "1.0.0"
  description: >
    A renter requesting a car, and the trips that result. Design authority
    is the "Cruz Ride Auto - Website" canvas ("detail" and "booking"
    screens).

    **This is the endpoint the whole customer side hangs off.** Before it,
    `bookings` rows could only be created by the merchant dev-seed, so the
    merchant Bookings screen had never seen a real request and the
    `category: "booking"` notification had no generator. A booking created
    here is an ordinary `bookings` row - it appears in the merchant's
    existing queue with no change to that screen.

    **Nothing is charged here.** The design is explicit: "Send request, pay
    nothing yet". A request is created `requested`; the merchant accepts or
    declines; payment (`POST /bookings/{id}/pay`) only makes sense once the
    booking is `confirmed`. A request that goes unanswered past its
    response window is swept to `expired` by the existing
    `jobs/booking-expiry` worker.

    **The server computes every figure.** Gross, commission, merchant-net
    and deposit all come from `computeBookingPricing` against the vehicle's
    own stored `daily_rate_amount`. The client sends dates and a vehicle
    id; it never sends money, and it never recomputes a total for display
    that the server did not produce (spec §2).

    **The two gates apply here too.** A car can only be requested while it
    is a live listing on an approved merchant - the same predicate the
    public catalog uses, read from the same place. A paused or unapproved
    car 404s exactly as it does in the catalog.

    **Availability ignores the renter's own pending requests.** The design
    allows it explicitly: "Requesting two cars for the same dates is
    allowed; you only ever pay for the one you confirm." Only `confirmed`
    and `active` bookings hold dates.
  license:
    name: Proprietary - Cruz Ride Auto Limited
servers:
  - url: https://api.cral.co.ke/v1
    description: Production
  - url: https://api.staging.cral.co.ke/v1
    description: Staging

tags:
  - name: bookings
    description: A renter's own bookings

paths:
  /bookings:
    post:
      tags: [bookings]
      summary: Request a car for a set of dates
      operationId: createBooking
      description: >
        Creates a `requested` booking and notifies the merchant. Requires
        an `Idempotency-Key` - a double-submitted request must not become
        two bookings on the owner's queue.

        The renter must have both identity documents on file (uploaded;
        Ops acceptance is only required before the keys change hands, per
        the design's own "You can send this request and pay, but
        {owner} cannot hand over the keys until CRAL has read it").
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup_at, dropoff_at]
              description: >
                A car, a car with one of its merchant's drivers, or a driver
                alone for the renter's own car (docs/plans/drivers.md) - at
                least one of `vehicle_id` / `driver_id`. A driver only comes
                with their own merchant's cars when that merchant lists drivers
                (422 `owner_driver_first`); when the car's owner has none, any
                checked driver can be added and the request becomes two linked
                bookings - the car with its owner, the driver with theirs - each
                accepted and paid on its own. The response is the car booking,
                with `linked_booking: { id, ref, status, gross }` (owner's call,
                2026-10-19). A chauffeured car takes no extra driver
                (422 `driver_not_for_this_car`).
                Priced one leg per thing hired, summed, same commission on
                each. A driver-only booking needs `hire_car_details`
                (422 `hire_car_details_required`) and only the renter's
                national ID, not their licence. 409 `driver_unavailable`
                when the driver has a confirmed job overlapping.
              properties:
                vehicle_id: { type: string, example: veh_01J... }
                driver_id: { type: string, example: drv_01J... }
                driver_unit:
                  type: string
                  enum: [day, hour, trip]
                  description: >
                    Which of the driver's rates prices their part. Defaults to
                    the car's unit, or the driver's first offered rate. 422
                    `driver_rate_unavailable` if they don't offer it. `hour`
                    bills the hours between pickup_at and dropoff_at, rounded up.
                hire_car_details:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: Driver-only - the car the driver is coming to drive.
                pickup_at:
                  type: string
                  format: date-time
                  description: RFC 3339 UTC. Nairobi is display-only (spec §2).
                dropoff_at: { type: string, format: date-time }
                note_from_hirer:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: The design's "Anything {owner} should know".
                route_from:
                  type: string
                  maxLength: 200
                  description: >
                    Truck listings only (PR T2), required there with the
                    other three route fields and `cargo_description` - 422
                    `route_required` / `cargo_required`. Sent for any other
                    listing it is refused, 422 `route_not_applicable`.
                    `pickup_location` / `dropoff_location` are filled from
                    the route.
                route_from_county: { type: string, description: "One of the 47 counties." }
                route_to: { type: string, maxLength: 200 }
                route_to_county: { type: string, description: "One of the 47 counties." }
                cargo_description: { type: string, maxLength: 300, example: "40 bags of cement" }
                cargo_kg:
                  type: integer
                  nullable: true
                  maximum: 100000
                  description: >
                    Optional rough weight in kg. Above the truck's
                    `payload_kg` is 422 `cargo_over_capacity`.
      responses:
        "201":
          description: The request was created and the owner notified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "404":
          description: >
            `vehicle_not_found` - not a live listing on an approved
            merchant. Deliberately indistinguishable from a car that
            never existed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: >
            `dates_unavailable` - a confirmed or active hire overlaps the
            requested window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: >
            `invalid_dates` (dropoff not after pickup, or pickup in the
            past), `below_minimum_hire` (shorter than the listing's
            `minimum_hire_days`), or `documents_required` (a paper this
            hire needs is not yet uploaded - the body names it). What a
            hire needs follows the owner's decision 3 (2026-11-26): the
            national ID always; the driving licence only when the renter
            drives - a self-drive vehicle with no driver coming with it.
            A chauffeured truck, a machine with its operator, or a driver
            for the renter's own car is requested with the ID alone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

    get:
      tags: [bookings]
      summary: My trips
      operationId: listMyBookings
      description: Cursor-paginated, newest first (spec §2 - no offset paging).
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, upcoming, on_hire, completed, cancelled]
            default: all
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of the caller's bookings.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, has_more, counts]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BookingSummary" }
                  next_cursor: { type: string, nullable: true }
                  has_more: { type: boolean }
                  counts:
                    type: object
                    description: Whole-set counts per filter, not page-bound.
                    additionalProperties: { type: integer }

  /bookings/{id}:
    get:
      tags: [bookings]
      summary: One of my bookings
      operationId: getMyBooking
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The booking.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "404":
          description: Not a booking on the caller's account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /bookings/{id}/accept-quote:
    post:
      tags: [bookings]
      summary: Accept the owner's quote (PR T3)
      operationId: acceptBookingQuote
      description: >
        Only on a `quoted` booking before `quote.expires_at` - 409
        `no_quote_to_accept` / `quote_expired` otherwise. Goes straight to
        `confirmed` (the owner agreed by quoting), then payment runs as for
        any confirmed booking. Saying no is the ordinary cancel, which
        withdraws a `quote_requested` or `quoted` booking.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Confirmed at the quoted price.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "409":
          description: No open quote, or it has lapsed.
  /bookings/{id}/driver-code:
    post:
      tags: [bookings]
      summary: Enter the code the driver read out, and start the job (DR4)
      operationId: enterDriverCode
      description: >
        Only for a booking with no car of the merchant's: a driver alone
        for the renter's own car, or the driver half of a linked booking
        (`vehicle` is null, `driver` is set). When such a booking is paid,
        its driver is texted the job and a 4-digit code
        (`jobs/driver-job-sms.ts`); the driver reads it to the renter, who
        enters it here. A right code completes the pickup in one step -
        there is no car of the merchant's to check over - so the booking
        goes `active` without the owner's login. The pickup handover then
        shows `code_holder: driver`, `state: completed`.

        Five wrong codes spend it (`otp_attempts_exhausted`); the owner can
        still run the handover from the merchant portal as before. The
        renter's papers must be cleared, as for any pickup. Car and car +
        driver bookings keep the owner's handover (409
        `driver_code_not_used`). Requires an `Idempotency-Key`: it
        completes a handover.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9]{4}$" }
      responses:
        "200":
          description: The job has started; the booking is `active`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "409":
          description: >
            `driver_code_not_used` (the booking has a car of the
            merchant's), `booking_not_confirmed` (not paid and confirmed,
            or already started), `driver_code_not_sent` (no code has gone
            to the driver yet), `otp_attempts_exhausted`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: >
            `otp_incorrect` (field `code`), `otp_expired` (the booking's
            time is over), `hirer_documents_not_accepted`, or a code that
            isn't four digits.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /bookings/{id}/cancel:
    post:
      tags: [bookings]
      summary: Cancel my booking
      operationId: cancelMyBooking
      description: >
        A `requested` booking can be withdrawn freely. A `confirmed` one
        can be cancelled up to the pickup moment; after that it is the
        merchant's cancellation path, not the renter's. Requires an
        `Idempotency-Key` because a confirmed cancellation can move money
        once a payment rail is live.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingDetail" }
        "409":
          description: >
            `booking_not_cancellable` - already finished, already
            cancelled, or past pickup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  schemas:

    BookingQuote:
      type: object
      nullable: true
      description: >
        The merchant's price on a quoted booking (PR T3). Null until they
        send one - a quote_requested booking's money fields are zero and
        are not a price. Valid until `expires_at` (48 h).
      required: [amount, note, quoted_at, expires_at]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        note: { type: string, nullable: true, maxLength: 500 }
        quoted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }

    BookingRoute:
      type: object
      nullable: true
      description: >
        Truck requests only (PR T2) - where the load is collected and where
        it goes. Null on every other booking.
      required: [from, from_county, to, to_county]
      properties:
        from: { type: string, example: "Godown 14, Enterprise Road" }
        from_county: { type: string, example: Nairobi }
        to: { type: string, example: "Site office, Kitengela" }
        to_county: { type: string, example: Kajiado }

    BookingCargo:
      type: object
      nullable: true
      description: Truck requests only (PR T2) - what's being moved. Null on every other booking.
      required: [description, kg]
      properties:
        description: { type: string, example: "40 bags of cement" }
        kg:
          type: integer
          nullable: true
          description: Rough weight in kilograms, if the renter gave one. Shown in tonnes.
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Integer cents. }
        currency: { type: string, example: KES }

    BookingVehicle:
      type: object
      description: >
        The same public projection the catalog uses - no owner contact
        details, no documents. The exact pickup address becomes available
        to the renter only once the booking is confirmed.
      required: [id, make, model, year, category, registration, county]
      properties:
        id: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: string }
        category: { type: string, enum: [sedan, suv, van, truck, machinery] }
        registration: { type: string }
        county: { type: string, nullable: true }
        seats: { type: integer }
        transmission: { type: string }
        chauffeured: { type: boolean }
        primary_photo_url: { type: string, nullable: true }
        owner_display_name: { type: string }

    BookingSummary:
      type: object
      required: [id, ref, status, pickup_at, dropoff_at, days, rate_unit, rate_quantity, gross, vehicle, created_at]
      properties:
        id: { type: string, example: bkg_01J... }
        ref:
          type: string
          description: The plated reference both sides read aloud, e.g. "CB-260922-001".
        status:
          type: string
          enum: [requested, quote_requested, quoted, confirmed, active, completed, declined, expired, cancelled]
        pickup_at: { type: string, format: date-time }
        dropoff_at: { type: string, format: date-time }
        days:
          type: integer
          description: >
            The calendar-day span of pickup_at..dropoff_at, always present
            regardless of hiring unit. What the hire was actually *priced*
            on is `rate_unit` + `rate_quantity`, not this field - for an
            `hour` or `trip` booking, `days` is span only, not the pricing
            basis (owner's call, 2026-09-23).
        rate_unit:
          type: string
          enum: [day, hour, trip]
          description: The vehicle's hiring unit at booking time - what `rate_quantity` counts.
        rate_quantity:
          type: integer
          description: Days for a `day` booking (equal to `days`), hours (rounded up) for `hour`, always 1 for `trip`.
        gross: { $ref: "#/components/schemas/Money" }
        vehicle: { $ref: "#/components/schemas/BookingVehicle" }
        created_at: { type: string, format: date-time }

    BookingDetail:
      allOf:
        - $ref: "#/components/schemas/BookingSummary"
        - type: object
          required: [deposit, pickup_location, dropoff_location, documents]
          properties:
            documents:
              type: object
              required: [cleared, items]
              description: >
                The renter's papers this hire needs, and whether CRAL has
                cleared them (H5). Only the kinds this hire needs are
                listed: `national_id` always, `driving_licence` only for
                self-drive. Payment (`POST /bookings/{id}/pay`) is refused
                with `papers_not_cleared` until `cleared` is true, so the
                keys never wait on a review after the renter has paid.
              properties:
                cleared:
                  type: boolean
                  description: Every listed paper is accepted by Ops (`ok`).
                items:
                  type: array
                  items:
                    type: object
                    required: [kind, state, review_note]
                    properties:
                      kind: { type: string, enum: [national_id, driving_licence] }
                      state:
                        type: string
                        enum: [missing, pending, ok, rejected, expiring]
                        description: >
                          `missing` - not uploaded; `pending` - with Ops;
                          `ok` - cleared; `rejected` - upload it again
                          (`review_note` says why); `expiring` - not
                          cleared until renewed.
                      review_note: { type: string, nullable: true }
            deposit:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: >
                Zero. CRAL takes no deposit for now (owner's call,
                2026-09-11) - there is no disbursement rail, so a deposit
                could be collected and not returned. Kept in the shape so
                the field does not appear and disappear if that changes.
            total_due:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: >
                What the renter is asked for once the owner accepts. CRAL
                charges no booking fee and takes no deposit, so this is
                exactly the hire.
            pickup_location: { type: string }
            dropoff_location: { type: string }
            route: { $ref: "#/components/schemas/BookingRoute" }
            cargo: { $ref: "#/components/schemas/BookingCargo" }
            quote: { $ref: "#/components/schemas/BookingQuote" }
            note_from_hirer: { type: string, nullable: true }
            response_due_at:
              type: string
              format: date-time
              nullable: true
              description: >
                When an unanswered request lapses. The design renders this
                as the "REQUEST LAPSES IN" countdown; the background
                sweep in `jobs/booking-expiry` is what actually expires it.
            decline_reason_code: { type: string, nullable: true }
            cancel_reason: { type: string, nullable: true }
            handovers:
              type: array
              description: >
                Newest first. Never the pickup/return code itself - only a
                hash of it exists server-side, and the real code only ever
                goes out by email (docs/plans/customer-portal.md C8). This
                is "is a code on its way / has pickup or return happened",
                for Trip detail's own handover status - not the merchant
                portal's fuller handover UI.
              items:
                type: object
                required: [kind, state, code_holder, masked_destination, otp_expires_at, completed_at]
                properties:
                  kind: { type: string, enum: [pickup, return] }
                  code_holder:
                    type: string
                    enum: [hirer, driver]
                    description: >
                      Who was given the pickup code. `hirer`: emailed to the
                      renter, who reads it to the owner. `driver` (DR4):
                      texted to the driver of a booking with no car of the
                      merchant's, who reads it to the renter, who enters it
                      with `POST /bookings/{id}/driver-code`.
                  state:
                    type: string
                    enum: [otp_sent, otp_verified, condition_logged, confirmed, completed, expired, failed]
                  masked_destination:
                    type: string
                    nullable: true
                    description: The email the code was sent to, masked (e.g. "j***@example.com").
                  otp_expires_at: { type: string, format: date-time, nullable: true }
                  completed_at: { type: string, format: date-time, nullable: true }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id]
          properties:
            type: { type: string }
            code: { type: string }
            message: { type: string }
            field: { type: string }
            doc_url: { type: string }
            request_id: { type: string }
